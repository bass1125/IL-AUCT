<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>卸载 IL AUCT</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
<style>
  /* 卸载器专用：单列居中，不摆侧边栏和右侧面板 —— 这里只有一件事要做 */
  #uni-main {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    background: var(--bg-main);
    display: flex; justify-content: center;
    padding: 18px 22px 22px;
  }
  .uni-wrap { width: 100%; max-width: 600px; }

  .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 14px; }
  .brand img { width: 44px; height: 44px; border-radius: 11px; display: block; flex: 0 0 auto; }
  .brand h1 { margin: 0 0 4px; font-size: 19px; font-weight: 600; letter-spacing: .2px; }
  .brand p {
    margin: 0; font-size: 11.5px; color: var(--text-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .alert {
    display: flex; gap: 11px; align-items: flex-start;
    background: rgba(248,113,113,.08);
    border: 1px solid rgba(248,113,113,.26);
    border-radius: var(--radius); padding: 11px 15px; margin-bottom: 12px;
  }
  .alert svg { width: 17px; height: 17px; flex: 0 0 auto; color: var(--red); margin-top: 1px; }
  .alert b { display: block; font-size: 13px; margin-bottom: 4px; color: var(--red); font-weight: 600; }
  .alert span { font-size: 12px; color: var(--text-2); line-height: 1.6; }

  /* 清单行 / 结果行 */
  .rows { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; gap: 11px; padding: 8px 0; }
  .row + .row { border-top: 1px solid var(--border-soft); }
  .row-mark {
    width: 18px; height: 18px; flex: 0 0 auto;
    display: grid; place-items: center; font-size: 12px; color: var(--text-3);
  }
  .row-mark.ok   { color: var(--green); }
  .row-mark.bad  { color: var(--red); }
  .row-mark.warn { color: var(--amber); }
  .row-main { flex: 1 1 auto; min-width: 0; }
  .row-title { font-size: 12.8px; color: var(--text); }
  .row-sub {
    font-size: 11.5px; color: var(--text-3); margin-top: 2px;
    line-height: 1.5; word-break: break-all;
  }
  .row-side {
    flex: 0 0 auto; font-size: 11.5px; color: var(--text-3);
    text-align: right; max-width: 200px;
  }
  .row-side.on   { color: var(--green); }
  .row-side.warn { color: var(--amber); }

  .uni-actions { margin: 6px 0 0; }
  .uni-actions .btn { flex: 1 1 0; }

  .btn-danger { background: var(--red); color: #1c0b0b; border-color: var(--red); font-weight: 600; }
  .btn-danger:hover { background: #fca5a5; border-color: #fca5a5; }
  .btn-danger.arming {
    background: #dc2626; color: #fff; border-color: #dc2626;
    animation: armPulse 1.1s ease-in-out infinite;
  }
  @keyframes armPulse { 50% { opacity: .68; } }

  .uni-foot {
    margin-top: 13px; font-size: 11.5px; color: var(--text-3);
    text-align: center; line-height: 1.65;
  }
  .uni-foot.ok   { color: var(--green); }
  .uni-foot.warn { color: var(--amber); }
</style>
</head>
<body>

<div id="app">

  <header id="titlebar">
    <div class="tb-left">
      <div class="tb-logo"><img src="logo.png" alt=""></div>
      <span class="tb-title">卸载 IL AUCT</span>
    </div>
    <div class="tb-right">
      <div class="tb-stat tb-muted" id="tb-status">读取中…</div>
    </div>
  </header>

  <div id="uni-main">
    <div class="uni-wrap">

      <div class="brand">
        <img src="logo.png" alt="">
        <div style="min-width:0">
          <h1>卸载 IL AUCT</h1>
          <p id="brand-sub">正在读取本机现状…</p>
        </div>
      </div>

      <div class="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
          <path d="M12 9v4M12 17h.01"/>
        </svg>
        <div>
          <b>卸载后开机不会再自动登录校园网</b>
          <span>想用回来得重新装一次，账号密码也要重填。</span>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <span class="card-title">将要移除</span>
          <span class="pill" id="pill-total">—</span>
        </div>
        <div class="rows" id="rows-remove">
          <div class="row">
            <span class="row-mark"></span>
            <div class="row-main"><div class="row-title">正在读取…</div></div>
          </div>
        </div>
      </div>

      <div class="card" id="card-optional">
        <div class="card-head"><span class="card-title">顺便一起删</span></div>
        <label class="switch-row">
          <span class="switch-text">
            <b>账号密码与配置</b>
            <em id="opt-cfg-sub">config.json</em>
          </span>
          <span class="switch"><input type="checkbox" id="ck-config"><i></i></span>
        </label>
        <label class="switch-row">
          <span class="switch-text">
            <b>运行日志</b>
            <em id="opt-log-sub">watch.log</em>
          </span>
          <span class="switch"><input type="checkbox" id="ck-logs"><i></i></span>
        </label>
      </div>

      <div class="form-actions uni-actions">
        <button class="btn btn-ghost" id="btn-cancel">取消</button>
        <button class="btn btn-danger" id="btn-go">确认卸载</button>
      </div>

      <div class="uni-foot" id="foot">正在准备…</div>

    </div>
  </div>

</div>

<div id="toast-wrap"></div>
<script src="uninstall.js"></script>
</body>
</html>
